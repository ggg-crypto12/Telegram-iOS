name: CI

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Fix submodule URLs
        run: |
          set -e

          git config submodule.submodules/TgVoipWebrtc/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git
          git config submodule.submodules/rlottie/rlottie.url https://github.com/TelegramMessenger/rlottie.git

          git submodule sync
          git submodule update --init --recursive

      - name: Set active Xcode path
        run: |
          set -e

          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')

          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -e

          sudo mkdir -p /Users/Shared
          sudo rm -rf /Users/Shared/telegram-ios
          sudo cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -e
          set -x

          SOURCE_DIR="/Users/Shared/telegram-ios"
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          APP_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')"

          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          python3 build-system/Make/ImportCertificates.py \
            --path build-system/fake-codesigning/certs

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # ==============================
          # Check IPA
          # ==============================

          if [ ! -f "bazel-bin/Telegram/Telegram.ipa" ]; then
            echo "ERROR: Telegram.ipa was not created."
            exit 1
          fi

          # ==============================
          # Collect IPA
          # ==============================

          OUTPUT_PATH="build/artifacts"

          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          cp \
            "bazel-bin/Telegram/Telegram.ipa" \
            "$OUTPUT_PATH/Telegram.ipa"

          # ==============================
          # Collect dSYMs
          # ==============================

          rm -rf build/DSYMs
          mkdir -p build/DSYMs

          find "bazel-bin/Telegram" \
            -type d \
            -name "*.dSYM" \
            -exec cp -R {} build/DSYMs/ \;

          DSYM_COUNT=$(find build/DSYMs -type d -name "*.dSYM" | wc -l | tr -d ' ')

          if [ "$DSYM_COUNT" -gt 0 ]; then
            echo "Found $DSYM_COUNT dSYM bundle(s)."

            zip -r \
              "$OUTPUT_PATH/Telegram.DSYMs.zip" \
              build/DSYMs

            echo "DSYM_CREATED=true" >> "$GITHUB_ENV"
          else
            echo "No dSYM files found."
            echo "DSYM_CREATED=false" >> "$GITHUB_ENV"
          fi

          # ==============================
          # Verify artifacts
          # ==============================

          echo "================================"
          echo "BUILD ARTIFACTS"
          echo "================================"

          ls -lh "$OUTPUT_PATH"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          if [ "$DSYM_CREATED" = "true" ]; then

            gh release create \
              "build-${BUILD_NUMBER}" \
              "/Users/Shared/telegram-ios/build/artifacts/Telegram.ipa" \
              "/Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip" \
              --title "Telegram ${APP_VERSION} (${BUILD_NUMBER})" \
              --notes "Custom Telegram iOS build with camera improvements."

          else

            gh release create \
              "build-${BUILD_NUMBER}" \
              "/Users/Shared/telegram-ios/build/artifacts/Telegram.ipa" \
              --title "Telegram ${APP_VERSION} (${BUILD_NUMBER})" \
              --notes "Custom Telegram iOS build with camera improvements."

          fi

      - name: Show result
        run: |
          echo ""
          echo "========================================"
          echo "       BUILD COMPLETED SUCCESSFULLY"
          echo "========================================"
          echo "Telegram version: $APP_VERSION"
          echo "Build number:     $BUILD_NUMBER"
          echo ""
          echo "Artifacts:"
          ls -lh /Users/Shared/telegram-ios/build/artifacts/
